name: Promote Release

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Existing source tag to promote, for example 0.0.42"
        required: true
        type: string
      release_version:
        description: "Release version, for example 1.0.0"
        required: true
        type: string
      update_gitops:
        description: "Also update gaz-gitops to the promoted release"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  GITOPS_REPO: https://github.com/pascariucosmin93/gaz-gitops.git

jobs:
  promote:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_version must match x.y.z"
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "calc=ghcr.io/$OWNER/calculatorgaz" >> $GITHUB_OUTPUT

      - name: Promote image tags
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          CALC_IMAGE: ${{ steps.img.outputs.calc }}
        run: |
          set -euo pipefail

          MAJOR="${RELEASE_VERSION%%.*}"
          MINOR="${RELEASE_VERSION%.*}"

          docker pull "$CALC_IMAGE:$SOURCE_TAG"
          docker tag "$CALC_IMAGE:$SOURCE_TAG" "$CALC_IMAGE:promote-smoke"
          docker network create gaz-promote-net

          cleanup() {
            local exit_code=$?
            docker rm -f gaz-promote-db gaz-promote-calc gaz-promote-auth gaz-promote-session >/dev/null 2>&1 || true
            docker network rm gaz-promote-net >/dev/null 2>&1 || true
            exit "$exit_code"
          }
          trap cleanup EXIT

          docker run -d --name gaz-promote-db --network gaz-promote-net \
            -e POSTGRES_USER=gaz \
            -e POSTGRES_PASSWORD=gaz \
            -e POSTGRES_DB=gaz \
            postgres:16-alpine

          for _ in $(seq 1 30); do
            if docker exec gaz-promote-db pg_isready -U gaz -d gaz >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          docker run -d --name gaz-promote-session --network gaz-promote-net \
            -v "$PWD/gaz-nextjs/scripts:/scripts:ro" \
            -e PORT=8088 \
            -e JWT_SECRET=test-session-jwt-secret \
            node:20-alpine \
            node /scripts/session-service.mjs

          docker run -d --name gaz-promote-auth --network gaz-promote-net \
            -v "$PWD/gaz-nextjs/scripts:/scripts:ro" \
            -e PORT=8083 \
            -e APP_BASE_URL=http://gaz-promote-calc:3000 \
            -e INTERNAL_API_KEY=test-internal-api-key \
            node:20-alpine \
            node /scripts/auth-service.mjs

          docker run -d --name gaz-promote-calc --network gaz-promote-net \
            -p 3000:3000 \
            -e DATABASE_URL=postgresql://gaz:gaz@gaz-promote-db:5432/gaz \
            -e ADMIN_EMAIL=admin@gmail.com \
            -e ADMIN_PASSWORD=admin \
            -e ADMIN_SESSION_SECRET=test-admin-session-secret \
            -e AUTH_SERVICE_URL=http://gaz-promote-auth:8083 \
            -e SESSION_SERVICE_URL=http://gaz-promote-session:8088 \
            -e INTERNAL_API_KEY=test-internal-api-key \
            "$CALC_IMAGE:promote-smoke"

          for _ in $(seq 1 45); do
            if curl --silent --show-error --fail --retry-all-errors http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          mkdir -p smoke-artifacts
          SMOKE_BASE_URL=http://127.0.0.1:3000 \
          SMOKE_ADMIN_EMAIL=admin@gmail.com \
          SMOKE_ADMIN_PASSWORD=admin \
          SMOKE_REPORT_PATH=smoke-artifacts/promote-smoke-report.json \
          node gaz-nextjs/scripts/smoke-api.mjs

          docker tag "$CALC_IMAGE:$SOURCE_TAG" "$CALC_IMAGE:$RELEASE_VERSION"
          docker tag "$CALC_IMAGE:$SOURCE_TAG" "$CALC_IMAGE:$MAJOR"
          docker tag "$CALC_IMAGE:$SOURCE_TAG" "$CALC_IMAGE:$MINOR"
          docker tag "$CALC_IMAGE:$SOURCE_TAG" "$CALC_IMAGE:latest"

          docker push "$CALC_IMAGE:$RELEASE_VERSION"
          docker push "$CALC_IMAGE:$MAJOR"
          docker push "$CALC_IMAGE:$MINOR"
          docker push "$CALC_IMAGE:latest"

      - name: Upload promote smoke report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: promote-smoke-report
          path: smoke-artifacts/promote-smoke-report.json
          retention-days: 30

      - name: Update gaz-gitops to promoted version
        if: ${{ inputs.update_gitops }}
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          GITOPS_PUSH_USER: ${{ secrets.GITOPS_PUSH_USER }}
          GITOPS_PUSH_TOKEN: ${{ secrets.GITOPS_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GITOPS_PUSH_USER:-}" ] || [ -z "${GITOPS_PUSH_TOKEN:-}" ]; then
            echo "GITOPS_PUSH_USER / GITOPS_PUSH_TOKEN not set."
            exit 1
          fi

          AUTH_REPO=$(echo "$GITOPS_REPO" | sed "s#https://#https://${GITOPS_PUSH_USER}:${GITOPS_PUSH_TOKEN}@#")
          WORKDIR=$(mktemp -d)

          git clone "$AUTH_REPO" "$WORKDIR/gitops"
          cd "$WORKDIR/gitops"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          release_version = os.environ["RELEASE_VERSION"]
          path = Path("k8s/chart/values.yaml")
          data = path.read_text()
          data = re.sub(
              r'(calculatorgaz:\n(?:.*\n)*?\s+tag:\s*)"[^"]+"',
              rf'\1"{release_version}"',
              data,
              count=1,
          )
          path.write_text(data)
          PY

          if git diff --quiet -- k8s/chart/values.yaml; then
            echo "gaz-gitops already on release ${RELEASE_VERSION}"
            exit 0
          fi

          git config user.name "Gaz CI Bot"
          git config user.email "gaz-ci-bot@users.noreply.github.com"
          git add k8s/chart/values.yaml
          git commit -m "chore(gitops): promote release ${RELEASE_VERSION}"
          git push origin main
