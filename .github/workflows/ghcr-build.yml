name: Build & Push to GHCR

on:
  push:
    branches:
      - main
    paths:
      - "gaz-nextjs/**"
      - "ocr-service/**"
      - ".github/workflows/ghcr-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  GITOPS_REPO: https://github.com/pascariucosmin93/gaz-gitops.git

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "gaz-nextjs/package-lock.json"

      - name: Set SHORT_SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::6}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # IMPORTANT: repo name lowercase (GHCR rule!)
      - name: Set image names
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "calc=ghcr.io/$OWNER/calculatorgaz" >> $GITHUB_OUTPUT
          echo "ocr=ghcr.io/$OWNER/ocr-service" >> $GITHUB_OUTPUT

      - name: Build & push calculatorgaz
        run: |
          docker build \
            -t ${{ steps.img.outputs.calc }}:${{ steps.vars.outputs.short_sha }} \
            -t ${{ steps.img.outputs.calc }}:latest \
            ./gaz-nextjs

          docker push ${{ steps.img.outputs.calc }}:${{ steps.vars.outputs.short_sha }}
          docker push ${{ steps.img.outputs.calc }}:latest

      - name: Build & push ocr-service
        run: |
          docker build \
            -t ${{ steps.img.outputs.ocr }}:${{ steps.vars.outputs.short_sha }} \
            -t ${{ steps.img.outputs.ocr }}:latest \
            ./ocr-service

          docker push ${{ steps.img.outputs.ocr }}:${{ steps.vars.outputs.short_sha }}
          docker push ${{ steps.img.outputs.ocr }}:latest

      - name: Update gaz-gitops image tags
        env:
          COMMIT_SHA: ${{ github.sha }}
          GITOPS_PUSH_USER: ${{ secrets.GITOPS_PUSH_USER }}
          GITOPS_PUSH_TOKEN: ${{ secrets.GITOPS_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GITOPS_PUSH_USER:-}" ] || [ -z "${GITOPS_PUSH_TOKEN:-}" ]; then
            echo "GITOPS_PUSH_USER / GITOPS_PUSH_TOKEN not set; skipping gaz-gitops update."
            exit 0
          fi

          SHORT_SHA="${COMMIT_SHA::6}"
          AUTH_REPO=$(echo "$GITOPS_REPO" | sed "s#https://#https://${GITOPS_PUSH_USER}:${GITOPS_PUSH_TOKEN}@#")
          WORKDIR=$(mktemp -d)

          git clone "$AUTH_REPO" "$WORKDIR/gitops"
          cd "$WORKDIR/gitops"

          python3 - <<'PY'
          from pathlib import Path
          path = Path("k8s/chart/values.yaml")
          data = path.read_text()
          replacements = {
              'repository: registry.infraejobs.ro/infra/gaz/calculatorgaz': 'repository: ghcr.io/pascariucosmin93/calculatorgaz',
              'repository: registry.infraejobs.ro/infra/gaz/ocr-service': 'repository: ghcr.io/pascariucosmin93/ocr-service',
          }
          for old, new in replacements.items():
              data = data.replace(old, new)
          import re, os
          short_sha = os.environ["SHORT_SHA"]
          data = re.sub(
              r'(calculatorgaz:\n(?:.*\n)*?\s+tag:\s*)"[^"]+"',
              rf'\1"{short_sha}"',
              data,
              count=1,
          )
          data = re.sub(
              r'(ocrService:\n(?:.*\n)*?\s+tag:\s*)"[^"]+"',
              rf'\1"{short_sha}"',
              data,
              count=1,
          )
          path.write_text(data)
          PY

          if git diff --quiet -- k8s/chart/values.yaml; then
            echo "gaz-gitops already up-to-date"
            exit 0
          fi

          git config user.name "Gaz CI Bot"
          git config user.email "gaz-ci-bot@users.noreply.github.com"
          git add k8s/chart/values.yaml
          git commit -m "chore(gitops): promote images to ${SHORT_SHA}"
          git push origin main
