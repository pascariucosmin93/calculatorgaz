name: Build & Push to GHCR

on:
  push:
    branches:
      - main
    paths:
      - "gaz-nextjs/**"
      - ".github/workflows/ghcr-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  GITOPS_REPO: https://github.com/pascariucosmin93/gaz-gitops.git

jobs:
  pre-build-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "gaz-nextjs/package-lock.json"

      - name: Run lint and unit tests
        working-directory: gaz-nextjs
        run: |
          npm ci --ignore-scripts
          npm run test:all

  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "gaz-nextjs/package-lock.json"

      - name: Run npm audit
        working-directory: gaz-nextjs
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --audit-level=critical

  build-test-push:
    needs:
      - pre-build-tests
      - dependency-scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "gaz-nextjs/package-lock.json"

      - name: Set version metadata
        id: vars
        run: |
          echo "short_sha=${GITHUB_SHA::6}" >> $GITHUB_OUTPUT
          echo "dev_version=0.0.${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # IMPORTANT: repo name lowercase (GHCR rule!)
      - name: Set image names
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "calc=ghcr.io/$OWNER/calculatorgaz" >> $GITHUB_OUTPUT

      - name: Build calculatorgaz image
        run: |
          docker build \
            -t ${{ steps.img.outputs.calc }}:${{ steps.vars.outputs.short_sha }} \
            -t ${{ steps.img.outputs.calc }}:${{ steps.vars.outputs.dev_version }} \
            ./gaz-nextjs

      - name: Smoke test built image
        env:
          CALC_IMAGE: ${{ steps.img.outputs.calc }}:${{ steps.vars.outputs.dev_version }}
        run: |
          set -euo pipefail

          wait_for_http() {
            local url="$1"
            local attempts="${2:-30}"
            for _ in $(seq 1 "$attempts"); do
              if curl --silent --show-error --fail --retry-all-errors "$url" >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          print_logs() {
            echo "=== gaz-smoke-calc logs ==="
            docker logs gaz-smoke-calc || true
            echo "=== gaz-smoke-auth logs ==="
            docker logs gaz-smoke-auth || true
            echo "=== gaz-smoke-session logs ==="
            docker logs gaz-smoke-session || true
            echo "=== gaz-smoke-db logs ==="
            docker logs gaz-smoke-db || true
          }

          cleanup() {
            local exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              print_logs
            fi
            docker rm -f gaz-smoke-db gaz-smoke-calc gaz-smoke-auth gaz-smoke-session >/dev/null 2>&1 || true
            docker network rm gaz-smoke-net >/dev/null 2>&1 || true
            exit "$exit_code"
          }
          trap cleanup EXIT

          docker network create gaz-smoke-net

          docker run -d --name gaz-smoke-db --network gaz-smoke-net \
            -e POSTGRES_USER=gaz \
            -e POSTGRES_PASSWORD=gaz \
            -e POSTGRES_DB=gaz \
            postgres:16-alpine

          for _ in $(seq 1 30); do
            if docker exec gaz-smoke-db pg_isready -U gaz -d gaz >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          docker run -d --name gaz-smoke-session --network gaz-smoke-net \
            -v "$PWD/gaz-nextjs/scripts:/scripts:ro" \
            -e PORT=8088 \
            -e JWT_SECRET=test-session-jwt-secret \
            node:20-alpine \
            node /scripts/session-service.mjs

          docker run -d --name gaz-smoke-auth --network gaz-smoke-net \
            -v "$PWD/gaz-nextjs/scripts:/scripts:ro" \
            -e PORT=8083 \
            -e APP_BASE_URL=http://gaz-smoke-calc:3000 \
            -e INTERNAL_API_KEY=test-internal-api-key \
            node:20-alpine \
            node /scripts/auth-service.mjs

          docker run -d --name gaz-smoke-calc --network gaz-smoke-net \
            -p 3000:3000 \
            -e DATABASE_URL=postgresql://gaz:gaz@gaz-smoke-db:5432/gaz \
            -e ADMIN_EMAIL=admin@gmail.com \
            -e ADMIN_PASSWORD=admin \
            -e ADMIN_SESSION_SECRET=test-admin-session-secret \
            -e AUTH_SERVICE_URL=http://gaz-smoke-auth:8083 \
            -e SESSION_SERVICE_URL=http://gaz-smoke-session:8088 \
            -e INTERNAL_API_KEY=test-internal-api-key \
            "$CALC_IMAGE"

          wait_for_http http://127.0.0.1:3000/api/health 45

          mkdir -p smoke-artifacts
          SMOKE_BASE_URL=http://127.0.0.1:3000 \
          SMOKE_ADMIN_EMAIL=admin@gmail.com \
          SMOKE_ADMIN_PASSWORD=admin \
          SMOKE_REPORT_PATH=smoke-artifacts/api-smoke-report.json \
          node gaz-nextjs/scripts/smoke-api.mjs

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-smoke-report
          path: smoke-artifacts/api-smoke-report.json
          retention-days: 30

      - name: Push calculatorgaz tags
        run: |
          docker push ${{ steps.img.outputs.calc }}:${{ steps.vars.outputs.short_sha }}
          docker push ${{ steps.img.outputs.calc }}:${{ steps.vars.outputs.dev_version }}

      - name: Update gaz-gitops image tags
        env:
          DEV_VERSION: ${{ steps.vars.outputs.dev_version }}
          GITOPS_PUSH_USER: ${{ secrets.GITOPS_PUSH_USER }}
          GITOPS_PUSH_TOKEN: ${{ secrets.GITOPS_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GITOPS_PUSH_USER:-}" ] || [ -z "${GITOPS_PUSH_TOKEN:-}" ]; then
            echo "GITOPS_PUSH_USER / GITOPS_PUSH_TOKEN not set; skipping gaz-gitops update."
            exit 0
          fi

          AUTH_REPO=$(echo "$GITOPS_REPO" | sed "s#https://#https://${GITOPS_PUSH_USER}:${GITOPS_PUSH_TOKEN}@#")
          WORKDIR=$(mktemp -d)

          git clone "$AUTH_REPO" "$WORKDIR/gitops"
          cd "$WORKDIR/gitops"

          python3 - <<'PY'
          from pathlib import Path
          path = Path("k8s/chart/values.yaml")
          data = path.read_text()
          replacements = {
              'repository: registry.infraejobs.ro/infra/gaz/calculatorgaz': 'repository: ghcr.io/pascariucosmin93/calculatorgaz',
          }
          for old, new in replacements.items():
              data = data.replace(old, new)
          import re, os
          dev_version = os.environ["DEV_VERSION"]
          data = re.sub(
              r'(calculatorgaz:\n(?:.*\n)*?\s+tag:\s*)"[^"]+"',
              rf'\1"{dev_version}"',
              data,
              count=1,
          )
          path.write_text(data)
          PY

          if git diff --quiet -- k8s/chart/values.yaml; then
            echo "gaz-gitops already up-to-date"
            exit 0
          fi

          git config user.name "Gaz CI Bot"
          git config user.email "gaz-ci-bot@users.noreply.github.com"
          git add k8s/chart/values.yaml
          git commit -m "chore(gitops): deploy dev version ${DEV_VERSION}"
          git push origin main
